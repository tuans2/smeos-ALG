services:
  db:
    build:
      context: ./docker
      dockerfile: postgres-pgcron.Dockerfile
    container_name: alg-db
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=alg"]
    environment:
      POSTGRES_USER: alg
      POSTGRES_PASSWORD: alg
      POSTGRES_DB: alg
    ports:
      - "5433:5432"
    volumes:
      - alg-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alg-db-data:
