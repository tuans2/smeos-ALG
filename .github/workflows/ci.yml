name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Tối ưu phút Actions (docs/audit/GITHUB_ACTIONS_OPTIMIZATION_REPORT.md, O-1): push mới vào cùng một PR huỷ run cũ
# của PR đó — kết quả run cũ không còn ai đọc. Push lên `main` KHÔNG bao giờ bị huỷ: nhóm theo SHA nên mỗi commit
# có run riêng, và Render (`autoDeployTrigger: checksPass`) cần check xanh của TỪNG commit trên `main` để deploy.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    # Run xanh dài nhất đo được ~51 phút (10/11/2026). Không đặt thì mặc định 360 phút: một bước treo đốt 6 giờ.
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: floraos
          POSTGRES_PASSWORD: floraos
          POSTGRES_DB: floraos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://floraos:floraos@localhost:5432/floraos
      # `test:tenant`/`test:platform` mặc định trỏ `smeos@5433/smeos_test` (máy dev, e8a75d2) —
      # CI dựng Postgres `floraos@5432`, nên phải chỉ rõ DB test ở đây, không thì cổng bắt buộc
      # không kết nối được (rà soát 21/10/2026, C4).
      DATABASE_URL_TEST: postgresql://floraos:floraos@localhost:5432/floraos_test
      SESSION_SECRET: ci-only-not-a-real-secret
      # P7 (YC-T8) — `src/lib/env.ts` BẮT BUỘC biến này. Thiếu nó thì bước
      # `npm run db:seed` ném ngay ở dòng import, trước cả `typecheck`, và
      # cổng bắt buộc `test:tenant` không bao giờ chạy tới. Khoá riêng, không
      # dùng lại SESSION_SECRET — giữ đúng lý do tách khoá của P7.
      INTEGRATION_TOKEN_SECRET: ci-only-not-a-real-integration-secret
      # SSO (floraos-core ↔ SocialFlow/LocalBudd) — `src/lib/env.ts` bắt buộc
      # (commit 23c2299). Thiếu thì `db:seed` ném ở dòng import như trường hợp P7.
      SSO_SESSION_SECRET: ci-only-not-a-real-sso-secret
      # Khoá GIẢ. `tests/tenant/product-copies.test.ts` mock HTTP
      # chat/completions và `tests/setup.ts` chặn mạng, nên không lời gọi nào ra
      # ngoài — nhưng `OpenAILLMProvider` đòi khoá có mặt lúc khởi tạo.
      OPENAI_API_KEY: ci-only-fake-key-network-is-blocked
      # Bản build/chạy production trên CI không có kho S3 — cho phép đĩa cục bộ (P0-05).
      ALLOW_LOCAL_STORAGE: "true"
      # Lưới an toàn cho công cụ còn chạy TypeScript 5.9 trong Node (ESLint, `next build`): `tsc` 5.9 đã chạm trần
      # heap mặc định ~2 GB của runner và chết OOM (PR #188, 07/11/2026). `npm run typecheck` nay dùng TypeScript 7
      # (bản Go, không bị trần heap của Node). Runner có ~7 GB RAM. PO duyệt 07/11/2026.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      # Postgres của CI là container dùng một lần rồi bỏ: không cần bền khi mất điện. Tắt fsync/full_page_writes/
      # synchronous_commit làm mỗi lần `resetDatabase()` (TRUNCATE ~150 bảng, gọi trước gần như mọi ca tenant) nhanh
      # ~3,9× khi đo (579 → 150 ms). Không đổi ngữ nghĩa giao dịch, khoá hay mức cô lập — chỉ bỏ bước ghi đĩa
      # đồng bộ. Cả ba tham số đổi được bằng reload, không phải khởi động lại container.
      - name: Postgres CI dùng một lần — tắt ghi đĩa đồng bộ
        env:
          PGPASSWORD: floraos
        run: |
          psql -h localhost -U floraos -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "SELECT pg_reload_conf()"
          psql -h localhost -U floraos -d postgres -Atc "SELECT name || '=' || setting FROM pg_settings WHERE name IN ('fsync','full_page_writes','synchronous_commit')"
      # Dựng CSDL bằng đúng lệnh production dùng (`migrate deploy`), rồi đòi
      # migration khớp schema.prisma: sửa schema mà quên `prisma migrate dev` là đỏ.
      - run: npm run db:deploy
      - name: Migration khớp schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      # Migration mới phải theo expand/contract (ADR-015 D-O4): chặn DROP không chú thích contract,
      # đổi kiểu không USING, thêm cột NOT NULL không DEFAULT, SET NOT NULL không backfill.
      - name: Migration theo quy ước expand/contract
        run: npm run check:migrations
      # Database RIÊNG cho `test:tenant`/`test:platform` — hai bộ test này
      # TRUNCATE mọi bảng và `tests/helpers/database.ts` từ chối database không
      # kết thúc bằng `_test`. Thiếu bước này thì cổng bắt buộc đỏ với
      # `database "floraos_test" does not exist` (CI run 4, 25/09/2026).
      - name: Dựng database floraos_test
        env:
          PGPASSWORD: floraos
        run: |
          psql -h localhost -U floraos -d postgres -c 'CREATE DATABASE floraos_test'
          DATABASE_URL=postgresql://floraos:floraos@localhost:5432/floraos_test npx prisma db push
      - run: npm run db:seed
      - run: npm run typecheck
      # Ratchet thay cho `npm run lint` (nợ #172, 05/10/2026): main mang 78 lỗi
      # ESLint cũ, bước lint đỏ trước nên CI bỏ qua MỌI bước sau — kể cả cổng
      # bắt buộc test:tenant. Ratchet đỏ khi (tệp, luật) nào tăng lỗi so với
      # scripts/eslint-baseline.json; lỗi cũ dọn dần rồi chạy --update-baseline.
      - name: ESLint (ratchet — không thêm lỗi mới)
        run: npm run lint:ratchet
      - name: Đối chiếu tài liệu với mã (đặc tả 06/07, cách ly tenant, tài liệu agent)
        run: npm run check:docs
      - name: Kiểm tra ranh giới tầng kiến trúc (F1-12)
        run: npm run check:layers
      - name: Kiểm tra đồng bộ Design Tokens Specification (F1-14)
        run: npm run check:tokens-doc
      # ADR-011 D-UI-07/D-UI-08: mọi page.tsx có Screen Contract v2 hoặc miễn trừ có lý do.
      # Cần `--check` — không có cờ này script chỉ in báo cáo, không bao giờ đỏ.
      - name: Kiểm tra độ bao phủ Screen Contract
        run: npm run check:screen-contracts -- --check
      - run: npm run lint:ux -- --check
      # Ratchet thuật ngữ ngành chạy ở job `industry-terms` riêng (P0-02, D-19): trước đây nó đứng
      # trước `npm test` nên một vi phạm thuật ngữ làm SKIP cả cổng tenant/platform/build (CI #286–#292).
      - run: npm test
      - name: Đối chiếu SSOT template với code thật
        run: npm run check:template-ssot
      # Cổng bắt buộc. Không được phép bỏ qua hay đánh dấu continue-on-error.
      - name: Test cách ly tenant
        run: npm run test:tenant
      # Cổng bắt buộc (P25a) — bốn ca thử cách ly console vận hành nền tảng,
      # xem tests/platform/cach-ly-platform.test.ts.
      - name: Test cách ly Console Vận hành Nền tảng
        run: npm run test:platform
      # KHÔNG còn `npm run build` ở đây (O-3): `e2e-ux` vốn đã `next build` đúng commit này để chạy E2E, nay build đó
      # bật lại kiểm kiểu (gồm typed routes trong `.next/types`) nên một lần build thay được cả hai — trước đây
      # mỗi run build 2 lần (~5,2 phút ở đây + ~1,8 phút ở `e2e-ux`). Cổng build vẫn bắt buộc, chỉ đổi job.

  # Chuỗi cung ứng (rà soát 21/10/2026, giai đoạn 3; PO duyệt 22/10). Repo công khai, nên một
  # khoá lọt vào bất kỳ commit nào là lộ ngay — quét toàn lịch sử, không chỉ commit mới.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Quét bí mật bằng gitleaks (báo nhầm đã duyệt nằm ở .gitleaksignore)
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      # Chặn lỗ hổng HIGH trở lên ở dependency chạy trên production — 0 lỗi từ 22/10/2026 (M11).
      # `xlsx` cài từ cdn.sheetjs.com (bản vá 0.20.3 không có trên npm): Dependabot không tự nâng được.
      - name: npm audit (production, mức high)
        run: npm audit --omit=dev --audit-level=high

  # Ratchet thuật ngữ ngành — job riêng, chạy song song để không che các cổng bắt buộc của `web`.
  industry-terms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      # Script chỉ dùng `node:fs`/`node:path`, nên không cần `npm ci` đầy đủ (62 s cho một bước 1 s — O-4): chỉ lấy
      # `tsx` đúng phiên bản ghim trong package-lock.json (~4 s). Cùng script, cùng cờ với `npm run audit:industry:check`.
      # Script mà thêm import gói npm thì bước này đỏ (không tìm thấy gói) — hỏng theo hướng an toàn, khi đó trả lại `npm ci`.
      - name: Thuật ngữ ngành hardcode (ratchet — không thêm vi phạm mới)
        run: |
          TSX_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/tsx'].version")
          npm exec --yes --package="tsx@${TSX_VERSION}" -- tsx scripts/industry-term-audit.ts --check

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
        with:
          # PR: cần commit cha của merge ref (HEAD^1 = đầu `main`) để biết PR đổi những tệp nào.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # O-5: pytest của worker chỉ đọc tệp trong `workers/` (đã rà `workers/tests`). 95/102 commit trên `main`
      # (20/10–10/11/2026) không chạm `workers/`, nên trên PR không đổi `workers/` (và không đổi tệp này) thì bỏ qua
      # cài đặt + pytest. Job vẫn chạy và XANH — tên check `worker` mà ruleset/Render đọc không đổi. Push lên `main`
      # LUÔN chạy đủ, nên commit được deploy luôn có pytest thật. Không đọc được diff thì chạy đủ (an toàn).
      - name: Phạm vi — PR có đổi mã worker không
        id: scope
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! changed=$(git diff --name-only HEAD^1 HEAD); then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if printf '%s\n' "$changed" | grep -qE '^(workers/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=worker::PR không đổi workers/ — bỏ qua pytest trên PR; push lên main vẫn chạy đủ."
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: workers/requirements.txt
      # Worker âm thanh/video gọi ffmpeg thật (phối trộn, đo độ to) — runner
      # ubuntu-latest không cài sẵn, thiếu thì 12 ca test_audio_worker /
      # test_voice_clone_worker đỏ `FileNotFoundError: 'ffmpeg'`.
      - if: steps.scope.outputs.run == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - if: steps.scope.outputs.run == 'true'
        run: pip install -r requirements.txt
      - if: steps.scope.outputs.run == 'true'
        run: python -m pytest tests -q

  e2e-ux:
    runs-on: ubuntu-latest
    # Run đo được ~11 phút (build 1,8 + E2E 6,2); build nay kiểm kiểu thêm ~3,5 phút. Mặc định 360 phút nếu treo.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: floraos
          POSTGRES_PASSWORD: floraos
          POSTGRES_DB: floraos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://floraos:floraos@localhost:5432/floraos
      SESSION_SECRET: ci-only-not-a-real-secret
      INTEGRATION_TOKEN_SECRET: ci-only-not-a-real-integration-secret
      SSO_SESSION_SECRET: ci-only-not-a-real-sso-secret
      OPENAI_API_KEY: ci-only-fake-key-network-is-blocked
      # Bản build/chạy production trên CI không có kho S3 — cho phép đĩa cục bộ (P0-05).
      ALLOW_LOCAL_STORAGE: "true"
      # Lưới an toàn cho công cụ còn chạy TypeScript 5.9 trong Node (ESLint, `next build`): `tsc` 5.9 đã chạm trần
      # heap mặc định ~2 GB của runner và chết OOM (PR #188, 07/11/2026). `npm run typecheck` nay dùng TypeScript 7
      # (bản Go, không bị trần heap của Node). Runner có ~7 GB RAM. PO duyệt 07/11/2026.
      NODE_OPTIONS: --max-old-space-size=4096
      # KHÔNG đặt SKIP_BUILD_TYPECHECK ở đây nữa (O-3): đây là lần `next build` DUY NHẤT của CI nên nó phải kiểm kiểu
      # như build cũ của job `web` — `npm run typecheck` chạy trước khi có `.next/types`, nên typed routes chỉ được kiểm
      # ở bước build này. Render vẫn bỏ kiểm kiểu (`render.yaml`) vì commit nó deploy đã qua bước này.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - name: Chạy kiểm thử E2E UX theo vai và mốc trợ năng
        run: E2E_WEB_COMMAND="npm run start" npx playwright test tests/e2e/ux
      # Giữ ảnh chụp/trace khi E2E đỏ. Ảnh `*-actual.png` của visual.spec.ts
      # chụp đúng trên runner này là nguồn ảnh mẫu `*-linux.png` (nợ #172) —
      # không chụp ảnh mẫu trên máy khác vì font tải từ Google lúc chạy.
      - name: Lưu kết quả E2E khi đỏ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ux-test-results
          path: test-results/
          retention-days: 7

  # KHÔNG có job deploy ở đây (PO 05/11/2026). `render.yaml` đặt `autoDeployTrigger: checksPass`
  # cho cả 5 dịch vụ: Render theo dõi check CI của commit trên `main` và chỉ deploy khi chúng
  # xanh. Chạy blueprint một lần là xong — không deploy hook, không secret `RENDER_DEPLOY_HOOK_*`.
  #
  # Cổng "chỉ phát hành bản đã qua kiểm" (P0-02, D-14) được GIỮ, chỉ đổi nơi thực thi: từ job
  # `deploy` ở đây sang chính Render. Hệ quả cho CI:
  #   • Tên 5 job dưới đây (`web`, `worker`, `e2e-ux`, `security`, `industry-terms`) giờ là thứ
  #     Render đọc để quyết định có deploy hay không. ĐỔI TÊN hoặc XOÁ một job là nới cổng
  #     production, không chỉ là sửa CI.
  #   • Commit trên `main` KHÔNG sinh check nào thì Render KHÔNG deploy (hỏng theo hướng an toàn).
  #     Vì vậy `on.push.branches: ["main"]` ở đầu tệp là một phần của cổng deploy, không được bỏ.
  #
  # Ruleset `main` (bắt buộc PR + 5 check, chặn force push) vẫn nên bật — giờ là lớp phòng vệ
  # thứ hai (chặn merge bản đỏ), không còn là cổng duy nhất.
  #
  # Quay lui: Render → dịch vụ → Deploys → Rollback (xem docs/handover/OPERATIONS_RUNBOOK.md §3–4).
