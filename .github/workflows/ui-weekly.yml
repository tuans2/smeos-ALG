name: UI Enterprise Weekly Quality & A11y Audit

on:
  schedule:
    # Chạy tự động lúc 03:00 sáng Thứ Hai hàng tuần (UTC)
    - cron: "0 3 * * 1"
  workflow_dispatch:

# O-2 (docs/audit/GITHUB_ACTIONS_OPTIMIZATION_REPORT.md): bấm chạy tay nhiều lần liền chỉ giữ một lần chạy (lần đang
# chạy không bị huỷ; lần chờ cũ được thay bằng lần mới nhất).
concurrency:
  group: ui-weekly
  cancel-in-progress: false

jobs:
  ui-enterprise-audit:
    name: Visual Regression & WCAG 2.2 AA (6 Viewports)
    runs-on: ubuntu-latest
    # E2E UX trên CI mất ~6 phút + dựng ~4 phút. Mặc định 360 phút nếu dev server treo.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alg
          POSTGRES_PASSWORD: alg
          POSTGRES_DB: alg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://alg:alg@localhost:5432/alg
      DATABASE_URL_TEST: postgresql://alg:alg@localhost:5432/alg_test
      SESSION_SECRET: ci-only-not-a-real-secret
      INTEGRATION_TOKEN_SECRET: ci-only-not-a-real-integration-secret
      SSO_SESSION_SECRET: ci-only-not-a-real-sso-secret
      OPENAI_API_KEY: ci-only-fake-key-network-is-blocked
      ALLOW_LOCAL_STORAGE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy database migrations
        run: npm run db:deploy

      - name: Seed database
        run: npx prisma db seed

      # Cùng bước với ci.yml: `db:test:setup` gọi `docker compose`, không chạy được
      # trên runner; `|| true` từng che lỗi đó nên DB test rỗng mà job vẫn chạy tiếp.
      - name: Dựng database alg_test
        env:
          PGPASSWORD: alg
        run: |
          psql -h localhost -U alg -d postgres -c 'CREATE DATABASE alg_test'
          DATABASE_URL=postgresql://alg:alg@localhost:5432/alg_test npx prisma db push

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Kiểm tra độ bao phủ Screen Contract v2 (100% Target)
        run: npm run check:screen-contracts -- --check

      - name: Kiểm tra UX Lint Ratchet (Zero regressions)
        run: npm run lint:ux -- --check

      - name: Kiểm tra chuẩn Đa ngành SSOT (5 Trụ cột)
        run: npm run check:industry

      - name: Chạy kiểm thử Playwright UX E2E & WCAG 2.2 AA
        run: npm run test:e2e:ux

      - name: Lưu trữ Playwright Report nếu có lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
